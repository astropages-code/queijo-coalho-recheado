<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Clockwise arc from left to right along the top -->
    <path id="textCurve" d="M 26, 115 A 75, 75 0 0, 1 174, 115" fill="none" />
  </defs>
  
  <text fill="rgba(255, 255, 255, 0.55)" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" letter-spacing="3.5">
    <textPath href="#textCurve" startOffset="50%" text-anchor="middle">
      • QUEIJO DE CASA •
    </textPath>
  </text>
  
  <g stroke="rgba(255, 255, 255, 0.65)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top rind of cheese -->
    <path d="M 70, 95 C 75, 75 90, 68 108, 68 C 122, 68 132, 75 138, 95" />
    <!-- Cheese body with rounded bottom corners and bottom arch notch -->
    <path d="M 70, 95 L 68, 120 C 68, 126 73, 130 79, 130 L 92, 130 C 95, 124 102, 120 108, 120 C 114, 120 121, 124 124, 130 L 131, 130 C 137, 130 142, 126 142, 120 L 138, 95 Z" />
    <!-- Big hole -->
    <circle cx="88" cy="110" r="6.5" stroke-width="2.6" />
    <!-- Small hole -->
    <circle cx="118" cy="114" r="4.5" stroke-width="2.4" />
  </g>
</svg>
