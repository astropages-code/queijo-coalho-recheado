<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Circle text path clockwise -->
    <path id="sealCircle" d="M 100, 100 m -80, 0 a 80, 80 0 1, 1 160, 0 a 80, 80 0 1, 1 -160, 0" fill="none"/>
  </defs>
  
  <!-- Rotated circular text so QUEIJO DE CASA is arched over top -->
  <g transform="rotate(-18 100 100)">
    <text fill="#274335" font-family="'Poppins', sans-serif" font-size="11.5" font-weight="600" letter-spacing="3.8px" opacity="0.82">
      <textPath href="#sealCircle" startOffset="0%">
        QUEIJO DE CASA • QUEIJO DE CASA •
      </textPath>
    </text>
  </g>
  
  <!-- Cheese Wedge (Level / Upright) in Brand Orange -->
  <g stroke="#DE6426" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 72, 95 C 77, 76 91, 70 108, 70 C 121, 70 131, 76 136, 95" />
    <path d="M 72, 95 L 70, 118 C 70, 124 75, 128 81, 128 L 93, 128 C 96, 122 102, 118 108, 118 C 114, 118 120, 122 123, 128 L 129, 128 C 135, 128 140, 124 140, 118 L 136, 95 Z" />
    <circle cx="88" cy="108" r="5.8" stroke-width="2.4" />
    <circle cx="118" cy="112" r="4.2" stroke-width="2.2" />
  </g>
</svg>
